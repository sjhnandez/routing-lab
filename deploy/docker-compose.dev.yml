# routing-lab dev stack: mock-upstream + litellm-lab + runner (profile "run") + lab-api (profile "api").
# Lab services are internal-only (no host ports); they share the default network.
# lab-api is the only service with a host port (127.0.0.1:3003) and has no
# docker access; the host-side deploy/executor.sh owns the queue -> battery flow.
# Run from the repo root:
#   up (quick):  LAB_PROFILE=quick docker compose --env-file deploy/pinned-versions.env -f deploy/docker-compose.dev.yml up -d
#   up (full):   LAB_PROFILE=full  docker compose --env-file deploy/pinned-versions.env -f deploy/docker-compose.dev.yml up -d
#   down:        LAB_PROFILE=quick docker compose --env-file deploy/pinned-versions.env -f deploy/docker-compose.dev.yml down
#   battery:     LAB_PROFILE=quick docker compose --env-file deploy/pinned-versions.env -f deploy/docker-compose.dev.yml --profile run run --rm runner
#   provenance:  export LAB_GIT_REV=$(git rev-parse --short HEAD)   # recorded in the battery report

name: routing-lab-dev

services:
  # Deterministic OpenAI-compatible mock upstream.
  mock-upstream:
    build: ../mock_upstream
    restart: "no"

  # LiteLLM proxy under test; config picked by LAB_PROFILE (quick is the default).
  litellm-lab:
    image: ${LITELLM_IMAGE}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ../lab_config/router.${LAB_PROFILE:-quick}.yaml:/app/config.yaml:ro
    depends_on:
      - mock-upstream
    restart: "no"

  # Scenario battery; run only via: docker compose --profile run run --rm runner.
  runner:
    profiles: ["run"]
    build: ../runner
    environment:
      - LAB_BASE_URL=http://litellm-lab:4000
      - LAB_PROFILE=${LAB_PROFILE:-quick}
      - LAB_MOCK_URL=http://mock-upstream:8000
      - LAB_GIT_REV=${LAB_GIT_REV:-unknown}
    volumes:
      - ../reports:/app/reports
      - ../lab_config:/lab_config:ro
      - ../deploy:/deploy:ro
    depends_on:
      - litellm-lab
    restart: "no"

  # Dashboard backend: run trigger + queue/report/docs API. Localhost-only
  # (127.0.0.1:3003). Deliberately has no docker.sock: POST /api/run drops a
  # request into queue/ and the host-side deploy/executor.sh runs it. The
  # prober's JSONL history is mounted read-only for GET /api/fleet (which
  # reports an empty state until the host-side prober has run).
  # Start: LAB_PROFILE=quick docker compose --env-file deploy/pinned-versions.env -f deploy/docker-compose.dev.yml --profile api up -d --build lab-api
  lab-api:
    profiles: ["api"]
    build: ../api
    ports:
      - "127.0.0.1:3003:8000"
    volumes:
      - ../dashboard/dist:/app/static:ro
      - ../reports:/app/reports:ro
      - ../queue:/app/queue
      - ../docs:/app/docs:ro
      - ../prober/history:/app/prober-history:ro
    environment:
      - LAB_TRIGGER=${LAB_TRIGGER:-on}
      - LAB_PROBER_HISTORY_DIR=/app/prober-history
    restart: "no"
